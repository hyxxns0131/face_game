<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>산타 포커페이스</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <header class="topbar">
    <a class="icon-btn back-btn" href="../" title="홈으로"><img class="px" src="../shared/assets/arrow_l_w.png" alt="홈" /></a>
    <div class="pl" id="pl1">
      <img class="ava px" alt="" />
      <div class="sub"><span class="name"></span><div class="hearts"></div></div>
    </div>
    <div class="clock" id="clock">0.0</div>
    <div class="pl right" id="pl2">
      <img class="ava px" alt="" />
      <div class="sub"><span class="name"></span><div class="hearts"></div></div>
    </div>
    <span class="mode-chip" id="mode-chip"></span>
  </header>

  <main class="arena" id="arena">
    <div class="panel p1" id="panel1">
      <canvas width="480" height="480"></canvas>
      <div class="panel-msg"></div>
      <div class="gauges">
        <div class="gauge smile"><span>😂</span><div class="bar"><i></i></div></div>
        <div class="gauge blink"><span>👁️</span><div class="bar"><i></i></div></div>
      </div>
    </div>
    <div class="vs">VS</div>
    <div class="panel p2" id="panel2">
      <canvas width="480" height="480"></canvas>
      <div class="panel-msg"></div>
      <div class="gauges">
        <div class="gauge smile"><span>😂</span><div class="bar"><i></i></div></div>
        <div class="gauge blink"><span>👁️</span><div class="bar"><i></i></div></div>
      </div>
    </div>
    <div id="distractions"></div>
    <div class="center-msg" id="center-msg"></div>
  </main>
  <p class="foot-hint">D 키: 인식 값 보기 · 설정(모드·난이도·하트)은 홈 화면 톱니바퀴에서</p>
  <div id="debug" hidden></div>
  <video id="video" playsinline muted></video>

  <!-- 시작 안내 -->
  <div class="result open" id="intro">
    <div class="modal pixel-box">
      <h2>🎅 산타 포커페이스</h2>
      <div class="winner" id="intro-chars"></div>
      <div class="stats" id="intro-info"></div>
      <p class="intro-tip">두 사람이 카메라 앞에 <b>나란히</b> 앉아 주세요.<br />웃거나 눈을 깜빡이면 <b>하트 -1</b>, 먼저 하트를 다 잃으면 패배!</p>
      <button class="icon-btn start-btn" id="btn-start"><img class="px" src="../shared/assets/start_xmas.png" alt="START" /></button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="result" id="result">
    <div class="modal pixel-box">
      <h2 id="r-title"></h2>
      <div class="winner" id="r-chars"></div>
      <div class="stats" id="r-stats"></div>
      <div class="coins" id="r-coins"></div>
      <div class="btns">
        <button class="pixel-btn" id="btn-again">한 판 더!</button>
        <a class="pixel-btn white" href="../" style="text-decoration:none">홈으로</a>
      </div>
    </div>
  </div>

  <script type="module" src="../shared/xmas.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
