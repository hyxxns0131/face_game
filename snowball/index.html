<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>눈덩이 대작전</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="snow.css" />
</head>
<body>
  <header class="topbar">
    <a class="icon-btn back-btn" href="../" title="홈으로"><img class="px" src="../shared/assets/arrow_l.png" alt="홈" /></a>
    <div class="pl" id="pl1">
      <img class="ava px" alt="" />
      <div class="sub"><span class="name"></span><div class="hearts"></div><span class="score"></span></div>
    </div>
    <div class="clock" id="clock">60</div>
    <div class="pl right" id="pl2">
      <img class="ava px" alt="" />
      <div class="sub"><span class="name"></span><div class="hearts"></div><span class="score"></span></div>
    </div>
    <span></span>
  </header>

  <main class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="cv"></canvas>
    <div class="center-msg" id="center-msg"></div>
  </main>
  <p class="foot-hint">D 키: 인식 값 보기 · 하트 개수·라운드 시간은 홈 화면 톱니바퀴에서</p>
  <div id="debug" hidden></div>

  <!-- 시작 안내 -->
  <div class="result open" id="intro">
    <div class="modal pixel-box">
      <h2>☃️ 눈덩이 대작전</h2>
      <div class="winner" id="intro-chars"></div>
      <div class="pick" id="mode-pick">
        <button data-v="duo" class="on">👫 친구랑 1:1</button>
        <button data-v="solo">☃️ 혼자 연습 (vs 봇)</button>
      </div>
      <ol class="howto">
        <li>❄️ 내리는 눈에 <b>손을 대서</b> 받기</li>
        <li>🌀 손을 <b>빙글빙글</b> 돌려 눈덩이 키우기</li>
        <li>💨 상대 쪽으로 팔을 <b>휙!</b> 던지기 (클수록 ⭐ 많지만 느림)</li>
        <li>😎 <b style="color:#e8244f">빨간 조준점</b>이 뜨면 몸을 움직여 피하기</li>
      </ol>
      <div class="stats" id="intro-info"></div>
      <button class="icon-btn start-btn" id="btn-start"><img class="px" src="../shared/assets/start.png" alt="START" /></button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="result" id="result">
    <div class="modal pixel-box">
      <h2 id="r-title"></h2>
      <div class="winner" id="r-chars"></div>
      <div class="stats" id="r-stats"></div>
      <div class="coins" id="r-coins"></div>
      <div class="btns">
        <button class="pixel-btn" id="btn-again">한 판 더!</button>
        <a class="pixel-btn white" href="../" style="text-decoration:none">홈으로</a>
      </div>
    </div>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
